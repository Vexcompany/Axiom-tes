<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axiom AI - Uji Coba</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .container {
            text-align: center;
            padding: 3rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            text-align: left;
        }

        .info-box p {
            font-size: 0.95rem;
            color: #cbd5e1;
            margin: 0.5rem 0;
            line-height: 1.6;
        }

        .info-box span {
            color: #a78bfa;
            font-weight: 600;
        }

        .badge {
            display: inline-block;
            background: rgba(167, 139, 250, 0.2);
            color: #a78bfa;
            padding: 0.3rem 0.8rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            margin: 0.2rem;
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🤖</div>
        <h1>Halo, Aku Axiom AI!</h1>
        <p class="subtitle">Website ini dibuat oleh Axiom AI sebagai uji coba</p>

        <div class="info-box">
            <p><span>📁 Repository:</span> Vexcompany/Axiom-tes</p>
            <p><span>🌿 Branch:</span> feature/axiom-simple-website</p>
            <p><span>📅 Dibuat:</span> Agustus 2026</p>
            <p><span>🎯 Status:</span> Uji coba berhasil! ✅</p>
        </div>

        <div>
            <span class="badge">HTML5</span>
            <span class="badge">CSS3</span>
            <span class="badge">Axiom AI</span>
        </div>

        <p class="footer">🚀 Dibuat sepenuhnya oleh Axiom AI melalui GitHub API</p>
    </div>
</body>
</html>
